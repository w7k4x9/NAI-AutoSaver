<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NAI 자동저장 · 업데이트</title>
  <style>
    /* a macOS window: icon on the left, text, push buttons bottom right */
    :root {
      --bg: #E9E9EB; --card: #F6F6F6; --text: #1D1D1F; --text2: #6E6E73; --text3: rgba(0,0,0,0.3);
      --sep: rgba(0,0,0,0.1); --accent: #007AFF; --accent-fill: #0064D2; --fill: rgba(0,0,0,0.045);
      --btn-bg: #FFFFFF; --btn-shadow: 0 0 0 0.5px rgba(0,0,0,0.14), 0 0.5px 1.5px rgba(0,0,0,0.1);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1A1A1A; --card: #2A2A2C; --text: #F2F2F2; --text2: #A1A1A6; --text3: rgba(255,255,255,0.3);
        --sep: rgba(255,255,255,0.1); --accent: #0A84FF; --accent-fill: #0071E3; --fill: rgba(255,255,255,0.06);
        --btn-bg: rgba(255,255,255,0.16); --btn-shadow: inset 0 0.5px 0 rgba(255,255,255,0.12), 0 0.5px 1px rgba(0,0,0,0.4);
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    html, body { background: var(--bg); }
    body {
      margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 10vh 16px 40px;
      color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      font-size: 13px; line-height: 1.5; word-break: keep-all; -webkit-font-smoothing: antialiased;
    }
    main { width: min(500px, 100%); }
    .card { display: grid; grid-template-columns: 64px minmax(0, 1fr); column-gap: 16px; padding: 20px 20px 18px; border-radius: 10px; background: var(--card);
      box-shadow: 0 0 0 0.5px var(--sep), 0 18px 50px rgba(0,0,0,0.18); }
    .card > * { grid-column: 2; }
    .badge { grid-column: 1; grid-row: 1 / span 3; width: 64px; height: 64px; color: var(--accent); display: flex; align-items: flex-start; justify-content: center; }
    .badge svg { display: block; width: 56px; height: 56px; }
    h1 { margin: 2px 0 0; font-size: 13px; font-weight: 700; }
    .sub { margin: 3px 0 0; color: var(--text2); font-size: 12px; }
    .notes { margin: 12px 0 0; padding: 10px 12px; border-radius: 7px; background: var(--fill); border: 0.5px solid var(--sep); max-height: 300px; overflow: auto; }
    .notes:empty { display: none; }
    .notes h2 { margin: 0 0 3px; font-size: 12px; font-weight: 650; }
    .notes h2 span { color: var(--text2); font-weight: 500; }
    .notes section + section { margin-top: 10px; }
    .notes ul { margin: 0; padding-left: 16px; color: var(--text2); font-size: 12px; }
    .notes li + li { margin-top: 2px; }
    .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .actions:not(:has(button:not([hidden]))) { display: none; }
    button {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 80px; height: 26px; padding: 0 14px; border: none; border-radius: 6px;
      font: inherit; font-size: 13px; cursor: pointer;
    }
    .primary { background: var(--accent-fill); color: #fff; font-weight: 600; }
    .primary:disabled { opacity: 0.45; cursor: default; }
    .plain { background: var(--btn-bg); color: var(--text); box-shadow: var(--btn-shadow); }
    .tip { margin: 8px 0 0; color: var(--text2); font-size: 11.5px; text-align: right; }
    .progress { margin-top: 14px; }
    .bar { height: 5px; border-radius: 3px; background: var(--fill); overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.2s; }
    .progress p { margin: 6px 0 0; color: var(--text2); font-size: 12px; }
    .msg { margin: 12px 0 0; padding: 10px 12px; border-radius: 7px; background: var(--fill); border: 0.5px solid var(--sep); color: var(--text); font-size: 12.5px; }
    .msg b { font-weight: 650; }
    .msg a { color: var(--accent); }
    .msg p { margin: 0; }
    .msg p + p, .msg p + ol, .msg ol + p { margin-top: 8px; }
    .msg .warn .found { margin-top: 6px; }
    .msg .warn { padding: 8px 10px; margin: -2px -4px 10px; border-radius: 6px; background: var(--card); }
    .msg .steps { margin: 8px 0 0; padding-left: 20px; }
    .msg .steps li + li { margin-top: 6px; }
    .msg .small { color: var(--text2); font-size: 12px; }
    .msg .found { margin: 8px 0 0; padding-left: 18px; color: var(--text2); font-size: 12px; }
    .msg .found code { word-break: break-all; }
    .manual { margin-top: 14px; border-top: 0.5px solid var(--sep); padding-top: 2px; }
    .manual summary { cursor: pointer; color: var(--text2); font-size: 12px; padding: 8px 0 2px; }
    .manual ol { margin: 8px 0 0; padding-left: 20px; color: var(--text2); font-size: 12px; }
    .manual li + li { margin-top: 6px; }
    .manual a { color: var(--accent); }
    .manual b { color: var(--text); font-weight: 600; }
    .manual .tip { text-align: left; }
    code { font: 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--fill); padding: 1px 4px; border-radius: 4px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <div class="badge" id="badge" data-icon="download_circle" data-size="56"></div>
      <h1 id="title">확인하는 중…</h1>
      <p class="sub" id="sub"></p>
      <div class="notes" id="notes"></div>

      <div class="progress" id="progress" hidden>
        <div class="bar"><i id="barFill"></i></div>
        <p id="progressText">준비하는 중…</p>
      </div>
      <div class="msg" id="msg" hidden></div>

      <div class="actions">
        <button class="plain" id="secondary" type="button" hidden></button>
        <button class="primary" id="primary" type="button" hidden></button>
      </div>
      <p class="tip" id="tip" hidden></p>

      <details class="manual" id="manual" hidden>
        <summary>직접 바꾸고 싶어요</summary>
        <ol>
          <li><a id="zipLink" href="#">새 버전 zip</a>을 받아서 압축을 풀어요.</li>
          <li>풀린 폴더 안의 파일을 <b>전부</b> 골라 복사한 뒤, <b>지금 쓰는 확장 프로그램 폴더</b>에 붙여 넣고 「덮어쓰기」를 골라요. 폴더 위치는 <a href="#" id="extLink">확장 프로그램 페이지</a>의 NAI 자동저장 → 세부정보 → 「소스」에 적혀 있어요.</li>
          <li>확장 프로그램 페이지에서 NAI 자동저장의 새로고침(↻) 버튼을 눌러요.</li>
        </ol>
        <p class="tip">새 폴더를 따로 「로드」하면 다른 확장으로 잡혀서 메모·대기열·보관함이 비어 보여요. 꼭 지금 폴더에 덮어써 주세요.</p>
      </details>
    </div>
  </main>
  <script src="icons.js"></script>
  <script src="lib-db.js"></script>
  <script src="update-check.js"></script>
  <script src="update.js"></script>
  <script src="update-extra.js"></script>
</body>
</html>
