<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NAI 자동저장 · 스토어 버전으로 옮겼어요</title>
  <style>
    /* a macOS alert window: icon on the left, push buttons bottom right */
    :root { --bg: #E9E9EB; --card: #F6F6F6; --text: #1D1D1F; --text2: #6E6E73; --accent: #007AFF; --accent-fill: #0064D2; --sep: rgba(0,0,0,0.1);
      --btn-bg: #FFFFFF; --btn-shadow: 0 0 0 0.5px rgba(0,0,0,0.14), 0 0.5px 1.5px rgba(0,0,0,0.1); color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1A1A1A; --card: #2A2A2C; --text: #F2F2F2; --text2: #A1A1A6; --accent: #0A84FF; --accent-fill: #0071E3; --sep: rgba(255,255,255,0.1);
      --btn-bg: rgba(255,255,255,0.16); --btn-shadow: inset 0 0.5px 0 rgba(255,255,255,0.12), 0 0.5px 1px rgba(0,0,0,0.4); } }
    body { margin: 0; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding-top: 14vh; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size: 13px; word-break: keep-all; -webkit-font-smoothing: antialiased; }
    .card { width: min(460px, calc(100vw - 32px)); display: grid; grid-template-columns: 64px minmax(0, 1fr); column-gap: 16px; padding: 20px 20px 18px; border-radius: 10px; background: var(--card); box-shadow: 0 0 0 0.5px var(--sep), 0 18px 50px rgba(0,0,0,0.18); }
    .card > * { grid-column: 2; }
    .ok { grid-column: 1; grid-row: 1 / span 3; width: 64px; height: 64px; color: var(--accent); display: flex; align-items: flex-start; justify-content: center; }
    h1 { margin: 2px 0 6px; font-size: 13px; font-weight: 700; }
    p { margin: 0 0 6px; color: var(--text2); font-size: 12px; line-height: 1.5; }
    .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    button { min-width: 80px; height: 26px; padding: 0 14px; border: none; border-radius: 6px; font: inherit; font-size: 13px; cursor: pointer; }
    .remove { background: var(--accent-fill); color: #fff; font-weight: 600; }
    .later { background: var(--btn-bg); color: var(--text); box-shadow: var(--btn-shadow); }
  </style>
</head>
<body>
  <main class="card">
    <div class="ok" data-icon="check_circle" data-size="56"></div>
    <h1>스토어 버전으로 옮겼어요</h1>
    <p>웹스토어에서 설치한 NAI 자동저장이 이제 일해요. 메모·대기열·설정은 그쪽으로 넘어갔어요.</p>
    <p>이 예전(압축해제) 버전은 패널도 저장도 멈췄으니 지워도 돼요.</p>
    <div class="actions">
      <button class="later" type="button" id="later">나중에</button>
      <button class="remove" type="button" id="remove">이 예전 버전 지우기</button>
    </div>
  </main>
  <script src="icons.js"></script>
  <script src="handoff.js"></script>
</body>
</html>
