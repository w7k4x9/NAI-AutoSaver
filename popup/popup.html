<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NAI 자동저장</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header class="header">
      <h1>NAI 자동저장</h1>
      <p id="pageStatus">페이지 확인 중…</p>
    </header>
    <main>
      <section class="group" aria-label="열기">
        <button id="openPanelBtn" class="row" type="button">
          <span class="row-ic" data-icon="sparkle" data-size="20"></span>
          <span class="row-label">패널 열기</span><span class="chev" data-icon="chevron" data-size="18"></span>
        </button>
        <button id="openLibraryBtn" class="row" type="button">
          <span class="row-ic" data-icon="photos" data-size="20"></span>
          <span class="row-label">보관함 열기</span><span class="chev" data-icon="chevron" data-size="18"></span>
        </button>
      </section>
      <section class="group">
        <label class="row toggle-row" for="autoSaveCheckbox">
          <span class="row-ic" data-icon="download_circle" data-size="21"></span>
          <span class="row-label">자동 저장<small>다 된 그림을 바로 내려받아요</small></span>
          <span class="switch"><input id="autoSaveCheckbox" type="checkbox"><span class="slider"></span></span>
        </label>
      </section>
      <p class="hint">생성·대기열·저장 이름은 NovelAI 페이지의 패널에서 정해요.</p>
    </main>
    <script src="../icons.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
